[pytest]
testpaths = tests scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -m "unit and not integration and not slow and not requires_external"
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true
markers =
    unit: deterministic test with external dependencies replaced by fakes or mocks
    integration: test of a configured service or multiple real components
    slow: test that takes substantially longer than the fast offline suite
    requires_external: test requires a network service, credential, or local external daemon
