# ===========================================================================
# MedFlow AI — Response Playbook: Credential Access (Category Playbook)
# ===========================================================================
#
# MITRE ATT&CK Tactics: Credential Access
#
# Covered techniques (applies_to_techniques list)
# ------------------------------------------------
# T1110   — Brute Force (parent)
# T1110.001 — Password Guessing
# T1110.002 — Password Cracking
# T1110.003 — Password Spraying
# T1110.004 — Credential Stuffing
# T1555   — Credentials from Password Stores (parent)
# T1555.003 — Credentials from Web Browsers
# T1555.004 — Windows Credential Manager
#
# MATCHING LOGIC (important — read before editing)
# -------------------------------------------------
# playbook_for_technique() uses EXACT string matching against this list.
# There is NO prefix/glob/wildcard matching.
# If a new sub-technique (e.g. T1110.005) is discovered in the wild and
# should route to this playbook, it must be explicitly added here.
# This is intentional — explicit enumeration is more auditable and
# predictable than wildcard matching for a healthcare incident-response
# context where routing mistakes have patient-safety implications.
#
# Healthcare context & reasoning
# --------------------------------
# Credential access techniques target the authentication layer of clinical
# systems. In healthcare:
#
#   • EHR systems use role-based credentials that, if compromised, grant
#     access to PHI for entire patient populations.
#   • Infusion pump management portals use shared service accounts;
#     credential theft here can lead to device-configuration tampering.
#   • Password spraying (T1110.003) is especially dangerous because it
#     avoids lockout thresholds and can silently compromise accounts used
#     by clinical staff across multiple shifts.
#   • Credentials from password stores (T1555) on a clinical workstation
#     can yield browser-saved EHR passwords that bypass MFA if sessions
#     are re-used.
#
# Action reasoning by tier
#   Tier 1: NOTIFY_SOC, LOG_EVENT, MONITOR_ACCOUNT, COLLECT_FORENSICS
#           — always safe, no operational side-effects.
#   Tier 2: BLOCK_IP, RESET_MFA, REVOKE_SESSION
#           — moderate disruption; BLOCK_IP targets the attacker not the
#             clinical asset. RESET_MFA and REVOKE_SESSION always require
#             approval because they interrupt active clinical sessions.
#   Tier 3: ISOLATE_ENDPOINT
#           — restricted on High (EHR servers) and Critical assets
#             (infusion pump management, ICU monitors) to prevent clinical
#             documentation blackouts or telemetry loss.
#   Tier 4: DISABLE_ACCOUNT
#           — restricted on Critical assets where a service account may
#             be the sole authentication path for life-support devices.

mitre_technique_id: CREDENTIAL_ACCESS
mitre_technique_name: "Credential Access (Brute Force, Password Stores)"
applies_to_techniques:
  # T1110 sub-techniques NOT handled by ssh_brute_force.yaml:
  #   T1110     → ssh_brute_force.yaml (SSH-specific, port-scoped block)
  #   T1110.001 → ssh_brute_force.yaml (Password Guessing via SSH)
  #   T1110.003 → ssh_brute_force.yaml (Password Spraying via SSH)
  - T1110.002   # Password Cracking (offline hash cracking — not SSH-specific)
  - T1110.004   # Credential Stuffing (replay of leaked credentials)
  # T1555 — Credentials from Password Stores family
  - T1555
  - T1555.003
  - T1555.004

actions:

  - name: NOTIFY_SOC
    risk_tier: 1
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 1 — immediate SOC alert. No operational side-effects.
    # First action for all credential-access incidents.

  - name: LOG_EVENT
    risk_tier: 1
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 1 — forensic audit entry. No operational impact.

  - name: MONITOR_ACCOUNT
    risk_tier: 1
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 1 — heighten telemetry on the targeted account.
    # No write to the account; purely observational.

  - name: COLLECT_FORENSICS
    risk_tier: 1
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 1 — memory/disk snapshot. Critical for identifying the
    # credential-theft method (keylogger, LSASS dump, browser store).

  - name: BLOCK_IP
    risk_tier: 2
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 2 — network deny-list for the attacker's source IP.
    # Targets the attacker's infrastructure, not the clinical device.
    # No asset-criticality restriction; safe for all asset types.

  - name: DROP_CONNECTION
    risk_tier: 2
    requires_approval: false
    reversible: true
    asset_criticality_restrictions: []
    # Tier 2 — force drops the active connection from the attacker.
    # Safe to execute without approval as it specifically targets the attacker's active session.

  - name: RESET_MFA
    risk_tier: 2
    requires_approval: true
    reversible: true
    asset_criticality_restrictions: []
    # Tier 2 — forces MFA re-enrollment.
    # Requires approval on all asset types: a forced reset during a
    # clinical shift can lock out staff mid-procedure.

  - name: REVOKE_SESSION
    risk_tier: 2
    requires_approval: true
    reversible: true
    asset_criticality_restrictions: ["Critical"]
    # Tier 2 — terminates all active sessions for the compromised account.
    # Requires approval because session revocation can interrupt clinicians
    # mid-procedure. Restricted for Critical assets: the active session may
    # belong to a clinician managing a patient in real time. The Phase 3
    # Planner also elevates approval when the target is a patient-care asset
    # even if incident-level criticality is High rather than Critical.

  - name: ISOLATE_ENDPOINT
    risk_tier: 3
    requires_approval: true
    reversible: true
    asset_criticality_restrictions: ["High", "Critical"]
    # Tier 3 — network isolation.
    # High (EHR servers): isolation cuts off clinical documentation; staff
    #   must revert to paper-based processes which delay care.
    # Critical (infusion pump mgmt, ICU monitors): kills real-time
    #   telemetry and automated dosing — direct patient-safety risk.

  - name: DISABLE_ACCOUNT
    risk_tier: 4
    requires_approval: true
    reversible: true
    asset_criticality_restrictions: ["Critical"]
    # Tier 4 — disables the compromised account entirely.
    # Restricted for Critical assets: a service account may be the only
    # authentication path for life-support telemetry systems.
    # Requires human approval at all criticality levels.
