[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medflow-ai-cybersecurity"
version = "0.1.0"
description = "AI Red Team and Threat Intelligence ecosystem for healthcare cybersecurity simulations."
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "groq>=0.9.0",
  "python-dotenv>=1.0.1",
]
