[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medflow-ai-cybersecurity"
version = "0.1.0"
description = "AI Red Team and Threat Intelligence ecosystem for healthcare cybersecurity simulations."
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "groq>=0.9.0",
  "python-dotenv>=1.0.1",
  "langgraph",
  "langchain-groq",
  "pymisp",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.31,<3.0",
  "PyYAML>=6.0,<7.0",
  "langchain-core",
]
